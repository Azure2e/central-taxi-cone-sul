{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block content %}
<div class="topbar">
  <div class="brand-sub">Recuperação</div>
  <h1>Definir senha</h1>
</div>
<div class="page">
  <p class="hint">Token validado. É de uso único e já está amarrado a este pedido. Mínimo de {{ min_pw }} caracteres.</p>
  <form method="post">
    <div class="form-group">
      <label>Nova senha</label>
      <input type="password" name="new" minlength="{{ min_pw }}" required>
    </div>
    <div class="form-group">
      <label>Confirmar</label>
      <input type="password" name="confirm" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Salvar senha</button>
  </form>
</div>
{% endblock %}
