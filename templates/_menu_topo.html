{% if user %}
<div id="menuLateral" style="position:fixed;top:0;right:-100%;width:300px;height:100%;background:linear-gradient(180deg,#0f172a,#14532d);color:#fff;z-index:9999;padding:24px 18px;transition:.3s;">
  <button type="button" id="fecharMenu" style="float:right;border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:12px;">✕</button>
  <p style="margin:48px 0 6px;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#86efac;">Cone Sul</p>
  <h3 style="margin:0 0 18px;">Menu</h3>
  <nav style="display:flex;flex-direction:column;gap:10px;">
    <a href="/admin" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">📊 Dashboard</a>
    <a href="/admin/motoristas" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">👨‍✈️ Motoristas</a>
    <a href="/admin/corridas" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">🚕 Corridas</a>
    <a href="/admin/encomendas" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">📦 Encomendas</a>
    <a href="/admin/pagamentos" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">💵 Pagamento</a>
    <a href="/admin/avisos" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:#06C167">🔔 Notificações</a>
    <a href="/admin/config" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">⚙️ Configurações</a>
    <a href="/admin/seguranca" style="color:#fff;text-decoration:none;padding:12px;border-radius:14px;background:rgba(255,255,255,.08)">🔒 Segurança</a>
    <a href="/logout" style="color:#fecaca;text-decoration:none;padding:12px;border-radius:14px;background:rgba(127,29,29,.45)">🚪 Sair</a>
  </nav>
</div>
<div id="fundoEscuro" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9998;"></div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.getElementById("btnMenu");
  var menu = document.getElementById("menuLateral");
  var fundo = document.getElementById("fundoEscuro");
  var fechar = document.getElementById("fecharMenu");
  function abrir() { if (menu && fundo) { menu.style.right = "0"; fundo.style.display = "block"; } }
  function fecha() { if (menu && fundo) { menu.style.right = "-100%"; fundo.style.display = "none"; } }
  if (btn) btn.onclick = abrir;
  if (fechar) fechar.onclick = fecha;
  if (fundo) fundo.onclick = fecha;
});
</script>
{% endif %}
